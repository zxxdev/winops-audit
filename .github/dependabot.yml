# Dependabot version updates, waiting 7 days after each release.
# Dependabot cannot read build/requirements.psd1 (PowerShell modules are not one of its
# ecosystems), so those versions are raised by hand: see CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
