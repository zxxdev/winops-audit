name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # PowerShell 7 runs on both: Linux checks the module logic, Windows is where it will run.
    name: Lint, test and help (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the PowerShell version
        run: $PSVersionTable | Format-Table -AutoSize | Out-String | Write-Output

      # Bootstrap installs the tools pinned in build/requirements.psd1; HelpCheck fails if the
      # built help differs from what is committed.
      - name: Build and check
        run: ./build.ps1 -Task Bootstrap, Lint, Test, HelpCheck

      # The inventory of the runner itself: real output from a real Windows, to read in the log.
      # Also when a test fails, to see what the system really gave.
      - name: Show the inventory of this runner
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          Import-Module ./src/WinOpsAudit/WinOpsAudit.psd1
          Get-WinOpsAuditInventory | Format-List | Out-String -Width 120 | Write-Output
          Get-WinOpsAuditUpdate | Out-String -Width 120 | Write-Output
          Get-WinOpsAuditSoftware -Name '*PowerShell*', 'Git*', '*Python*' | Out-String -Width 120 | Write-Output

      # The certificates, from the same runner: the trusted roots that expire within a year, and
      # what a few public servers send. badssl.com keeps test servers that are broken on purpose,
      # such as one that does not send its intermediate. A server that does not answer only
      # writes an error; it does not fail the job.
      - name: Show the certificates this runner sees
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          Import-Module ./src/WinOpsAudit/WinOpsAudit.psd1
          $roots = @(Get-WinOpsAuditCertificate -StoreName Root -ExpiringInDays 365)
          "Trusted roots that have expired or expire within 365 days: $($roots.Count)"
          $roots | Group-Object -Property Status -NoElement | Format-Table Name, Count -AutoSize | Out-String | Write-Output
          $roots | Where-Object Status -EQ 'Expiring' |
            Format-Table Subject, NotAfter, DaysLeft, Findings -AutoSize | Out-String -Width 200 | Write-Output
          'github.com', 'incomplete-chain.badssl.com', 'expired.badssl.com' |
            Get-WinOpsAuditTlsCertificate -ErrorAction Continue |
            Format-Table ComputerName, DaysLeft, Status, SentCount, ChainStatus, MissingCertificate, Findings -AutoSize |
            Out-String -Width 200 | Write-Output
